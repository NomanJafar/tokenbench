[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenbench"
version = "0.1.0"
description = "Load-testing harness for LLM inference servers: TTFT, inter-token latency and throughput under rising concurrency, with reproducible latency curves"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
tokenbench = "tokenbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
